name: Build VidSyncVST macOS VST3

on:
  push:
    branches: [main]
    paths:
      - "VidSyncVST/**"
      - ".github/workflows/build-dmg.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S VidSyncVST -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: Build VST3
        run: cmake --build build --config Release --target VidSyncVST_VST3 --parallel

      - name: Validate universal VST3 bundle
        shell: bash
        run: |
          set -euo pipefail
          VST3_PATH="$(find build -type d -name 'VidSyncVST.vst3' -print -quit)"
          test -n "$VST3_PATH"
          BINARY="$(find "$VST3_PATH/Contents/MacOS" -type f -maxdepth 1 -print -quit)"
          test -n "$BINARY"
          plutil -lint "$VST3_PATH/Contents/Info.plist"
          lipo -verify_arch arm64 x86_64 "$BINARY"
          echo "Validated: $VST3_PATH"
          ditto "$VST3_PATH" VidSyncVST.vst3

      - name: Package DMG
        run: |
          mkdir -p dmg_root
          ditto VidSyncVST.vst3 dmg_root/VidSyncVST.vst3
          ln -s "/Library/Audio/Plug-Ins/VST3" "dmg_root/Drag to VST3 Folder"
          hdiutil create -volname "VidSyncVST Installer" \
            -srcfolder dmg_root -ov -format UDZO VidSyncVST_Mac.dmg

      - name: Upload VST3 and DMG
        uses: actions/upload-artifact@v4
        with:
          name: VidSyncVST-macOS-Universal
          path: |
            VidSyncVST.vst3
            VidSyncVST_Mac.dmg
          if-no-files-found: error
