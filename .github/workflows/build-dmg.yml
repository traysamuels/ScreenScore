name: Build VidSyncVST Mac Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S VidSyncVST -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build VST3 Plugin
        run: |
          cmake --build build \
            --config Release \
            --target VidSyncVST_VST3

      - name: Package DMG
        run: |
          mkdir -p dmg_root

          VST3_PATH=$(find build -name "VidSyncVST.vst3" -type d | head -n 1)
          if [ -z "$VST3_PATH" ]; then
            echo "Error: VidSyncVST.vst3 not found in build directory!"
            exit 1
          fi
          echo "Found VST3 at: $VST3_PATH"

          ditto "$VST3_PATH" dmg_root/VidSyncVST.vst3

          # Create a link to the user's VST3 directory for easy drag-and-drop install
          ln -s "/Library/Audio/Plug-Ins/VST3" dmg_root/VST3

          hdiutil create \
            -volname "VidSyncVST Installer" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            VidSyncVST_Mac.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: VidSyncVST-Mac-Installer
          path: VidSyncVST_Mac.dmg
          if-no-files-found: error
