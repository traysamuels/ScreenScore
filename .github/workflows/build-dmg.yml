name: Build VidSyncVST macOS VST3

on:
  push:
    branches: [main]
    paths:
      - "VidSyncVST/**"
      - ".github/workflows/build-dmg.yml"
      - "README.md"
  pull_request:
    paths:
      - "VidSyncVST/**"
      - ".github/workflows/build-dmg.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Timecode checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I VidSyncVST/Source \
            VidSyncVST/tests/timecode_test.cpp -o /tmp/timecode_test
          /tmp/timecode_test

      - name: Build and install VST3
        run: bash VidSyncVST/build_mac.sh

      - name: Validate universal VST3 bundle
        shell: bash
        run: |
          set -euo pipefail
          VST3_PATH="$(find VidSyncVST/build -type d -name 'VidSyncVST.vst3' -print -quit)"
          test -n "$VST3_PATH"
          BINARY="$(find "$VST3_PATH/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$BINARY"
          plutil -lint "$VST3_PATH/Contents/Info.plist"
          # Apple's lipo syntax expects the input file before -verify_arch.
          lipo "$BINARY" -verify_arch arm64 x86_64
          test -d "/Library/Audio/Plug-Ins/VST3/VidSyncVST.vst3"
          echo "Validated: $VST3_PATH"
          ditto "$VST3_PATH" VidSyncVST.vst3

      - name: Package DMG
        run: |
          mkdir -p dmg_root
          ditto VidSyncVST.vst3 dmg_root/VidSyncVST.vst3
          ln -s "/Library/Audio/Plug-Ins/VST3" "dmg_root/Drag to VST3 Folder"
          hdiutil create -volname "VidSyncVST Installer" \
            -srcfolder dmg_root -ov -format UDZO VidSyncVST_Mac.dmg

      - name: Upload VST3 and DMG
        uses: actions/upload-artifact@v4
        with:
          name: VidSyncVST-macOS-Universal
          path: |
            VidSyncVST.vst3
            VidSyncVST_Mac.dmg
          if-no-files-found: error
